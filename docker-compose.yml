# Docker Compose для локального запуска приложения.
#
# Запуск:            docker compose up --build
# Остановка:         docker compose down
# Сброс базы:        docker compose down -v
#
# По умолчанию используются даты из plans.json. TEST_PLAN_START — только для тестов.

services:
  app:
    build: .
    image: bible-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Belgrade}
      TEST_PLAN_START: ${TEST_PLAN_START:-}
      # Доступ по обычному HTTP (локальная сеть, http://192.168.x.x): cookie без
      # флага Secure, иначе браузер её отбрасывает и вход «теряется». За HTTPS
      # поставьте COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - bible-data:/app/server/data
    restart: unless-stopped

  # Прогон автотестов:  docker compose run --rm test
  test:
    build:
      context: .
      target: server
    image: bible-app-test
    profiles: ["test"]
    environment:
      NODE_ENV: production
    command: npm test
    working_dir: /app/server

volumes:
  bible-data:
